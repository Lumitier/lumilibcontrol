plugins {
	// Loom 1.19.3 verlangt Gradle >= 9.8.0 und baut mit Java 25.
	// Der Mod-Code selbst bleibt auf Java-Level 21 (siehe unten).
	id 'fabric-loom' version '1.19.3'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// LumiLib - liegt lokal, dorthin veroeffentlicht
	// mit publishToMavenLocal im LumiLib-Projekt.
	mavenLocal()
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// LumiLib ist hier PFLICHT, nicht optional: Ohne den Hub gibt es
	// kein Menue, und ohne LumiLibs Empfang keine Regeln. Trotzdem nicht
	// mitbuendeln - der Nutzer installiert LumiLib einmal, nicht in
	// jedem Jar.
	//
	// transitive = false: LumiLibs eigene Abhaengigkeiten (YACL, Mod Menu,
	// Quilt-Parser) braucht diese Mod nicht - und ohne den Schalter wuerde
	// Gradle sie suchen, auf Servern, die hier gar nicht eingetragen sind.
	modImplementation("com.lumitier.lumilib:lumilib:1.5.4") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
